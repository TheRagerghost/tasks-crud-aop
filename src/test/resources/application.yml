spring:
  application:
    name: tasks-crud-aop
  profiles:
    include:
      - kafka
      - mail
  datasource:
    url: jdbc:tc:postgresql:11.13:///tasks_crud_aop
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true