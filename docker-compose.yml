version: '1.0'

services:
  
  postgres:
    image: postgres:11.13
    container_name: taskapp-pgdb
    ports:
      - '5432:5432'
    environment:
      - POSTGRES_DB=tasksappdb
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin

  zookeeper_taskapp:
    image: confluentinc/cp-zookeeper:5.5.0
    hostname: zookeeper_taskapp
    container_name: zookeeper_taskapp
    ports:
      - '2182:2182'
    environment:
      ZOOKEEPER_CLIENT_PORT: 2182
      ZOOKEEPER_TICK_TIME: 2000

  broker_taskapp:
    image: confluentinc/cp-kafka:5.5.0
    hostname: broker_taskapp
    container_name: broker_taskapp
    depends_on:
      - zookeeper_taskapp
    ports:
      - '29092:29092'
      - '9092:9092'
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: 'zookeeper_taskapp:2182'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker_taskapp:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0